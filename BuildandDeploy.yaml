name: Service1 CloudFormation Deploy

on:
  workflow_dispatch:
    inputs:
      service_name:
        description: "Service name used in the image tag and stack."
        required: false
        default: "service1"
        type: string
      image_tag:
        description: "Optional image tag (defaults to workflow run id)."
        required: false
        type: string
      context:
        description: "Docker build context."
        required: false
        default: "."
        type: string
      dockerfile:
        description: "Dockerfile path."
        required: false
        default: "Dockerfile"
        type: string

permissions:
  id-token: write
  contents: read
  packages: read

jobs:
  build-dev:
    name: Build & Push (dev)
    uses: ./.github/workflows/ai-tools-build-push-dev-nextjs.yaml
    with:
      service_name: ${{ inputs.service_name }}
      image_tag: ${{ inputs.image_tag }}
      context: ${{ inputs.context }}
      dockerfile: ${{ inputs.dockerfile }}
    secrets: inherit

  deploy-dev:
    name: Deploy (dev)
    runs-on: ubuntu-24.04
    needs: build-dev
    environment: dev
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      DEV_ECR_URL: ${{ vars.DEV_ECR_URL }}
      DEV_ECS_CLUSTER_NAME: ${{ vars.DEV_ECS_CLUSTER_NAME }}
      DEV_SUBNET_IDS: ${{ vars.DEV_SUBNET_IDS }}
      DEV_SECURITY_GROUP_IDS: ${{ vars.DEV_SECURITY_GROUP_IDS }}
      DEV_TASK_EXEC_ROLE_ARN: ${{ vars.DEV_TASK_EXEC_ROLE_ARN }}
      DEV_TASK_ROLE_ARN: ${{ vars.DEV_TASK_ROLE_ARN }}
      DEV_DESIRED_COUNT: ${{ vars.DEV_DESIRED_COUNT }}
      DEV_CPU: ${{ vars.DEV_CPU }}
      DEV_MEMORY: ${{ vars.DEV_MEMORY }}
      DEV_CONTAINER_PORT: ${{ vars.DEV_CONTAINER_PORT }}
      DEV_ASSIGN_PUBLIC_IP: ${{ vars.DEV_ASSIGN_PUBLIC_IP }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS Credentials (dev)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEV_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy CloudFormation (dev)
        run: |
          set -euo pipefail

          APP_FILE="common/cloudformation/templates/service1-application-dev.yaml"

          required_vars=(
            DEV_ECR_URL
            DEV_ECS_CLUSTER_NAME
            DEV_SUBNET_IDS
            DEV_SECURITY_GROUP_IDS
            DEV_TASK_EXEC_ROLE_ARN
            DEV_TASK_ROLE_ARN
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required variable: $var"
              exit 1
            fi
          done

          REPO_NAME=${GITHUB_REPOSITORY#"zinnia/"}
          TAG="${{ inputs.image_tag }}"
          TAG=${TAG:-$GITHUB_RUN_ID}

          PARAMS=()

          if [ -f "$APP_FILE" ]; then
            while IFS=":" read -r key value || [ -n "$key" ]; do
              key="$(echo "$key" | xargs)"
              value="$(echo "$value" | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')"
              if [ -z "$key" ] || [[ "$key" == \#* ]]; then
                continue
              fi
              PARAMS+=("$key=$value")
            done < "$APP_FILE"
          else
            echo "Missing application config: $APP_FILE"
            exit 1
          fi

          PARAMS+=(
            EnvironmentName=dev
            ServiceName="${{ inputs.service_name }}"
            ImageTag="$TAG"
            EcrUrl="$DEV_ECR_URL"
            RepoName="$REPO_NAME"
            ClusterName="$DEV_ECS_CLUSTER_NAME"
            SubnetIds="$DEV_SUBNET_IDS"
            SecurityGroupIds="$DEV_SECURITY_GROUP_IDS"
            TaskExecutionRoleArn="$DEV_TASK_EXEC_ROLE_ARN"
            TaskRoleArn="$DEV_TASK_ROLE_ARN"
          )

          if [ -n "${DEV_DESIRED_COUNT:-}" ]; then PARAMS+=(DesiredCount="$DEV_DESIRED_COUNT"); fi
          if [ -n "${DEV_CPU:-}" ]; then PARAMS+=(Cpu="$DEV_CPU"); fi
          if [ -n "${DEV_MEMORY:-}" ]; then PARAMS+=(Memory="$DEV_MEMORY"); fi
          if [ -n "${DEV_CONTAINER_PORT:-}" ]; then PARAMS+=(ContainerPort="$DEV_CONTAINER_PORT"); fi
          if [ -n "${DEV_ASSIGN_PUBLIC_IP:-}" ]; then PARAMS+=(AssignPublicIp="$DEV_ASSIGN_PUBLIC_IP"); fi

          aws cloudformation deploy \
            --stack-name "service1-dev" \
            --template-file "common/cloudformation/templates/service1-cloudformation.yaml" \
            --parameter-overrides "${PARAMS[@]}"

  promote-staging:
    name: Promote to staging
    uses: ./.github/workflows/ai-tools-promote-image.yaml
    needs: deploy-dev
    with:
      service_name: ${{ inputs.service_name }}
      image_tag: ${{ inputs.image_tag }}
      src_role_arn: ${{ vars.DEV_ROLE_ARN }}
      src_ecr_url: ${{ vars.DEV_ECR_URL }}
      dst_role_arn: ${{ vars.STAGING_ROLE_ARN }}
      dst_ecr_url: ${{ vars.STAGING_ECR_URL }}
      deploy_env: staging
    secrets: inherit

  deploy-staging:
    name: Deploy (staging)
    runs-on: ubuntu-24.04
    needs: promote-staging
    environment: staging
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      STAGING_ECR_URL: ${{ vars.STAGING_ECR_URL }}
      STAGING_ECS_CLUSTER_NAME: ${{ vars.STAGING_ECS_CLUSTER_NAME }}
      STAGING_SUBNET_IDS: ${{ vars.STAGING_SUBNET_IDS }}
      STAGING_SECURITY_GROUP_IDS: ${{ vars.STAGING_SECURITY_GROUP_IDS }}
      STAGING_TASK_EXEC_ROLE_ARN: ${{ vars.STAGING_TASK_EXEC_ROLE_ARN }}
      STAGING_TASK_ROLE_ARN: ${{ vars.STAGING_TASK_ROLE_ARN }}
      STAGING_DESIRED_COUNT: ${{ vars.STAGING_DESIRED_COUNT }}
      STAGING_CPU: ${{ vars.STAGING_CPU }}
      STAGING_MEMORY: ${{ vars.STAGING_MEMORY }}
      STAGING_CONTAINER_PORT: ${{ vars.STAGING_CONTAINER_PORT }}
      STAGING_ASSIGN_PUBLIC_IP: ${{ vars.STAGING_ASSIGN_PUBLIC_IP }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS Credentials (staging)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.STAGING_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy CloudFormation (staging)
        run: |
          set -euo pipefail

          APP_FILE="common/cloudformation/templates/service1-application-staging.yaml"

          required_vars=(
            STAGING_ECR_URL
            STAGING_ECS_CLUSTER_NAME
            STAGING_SUBNET_IDS
            STAGING_SECURITY_GROUP_IDS
            STAGING_TASK_EXEC_ROLE_ARN
            STAGING_TASK_ROLE_ARN
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required variable: $var"
              exit 1
            fi
          done

          REPO_NAME=${GITHUB_REPOSITORY#"zinnia/"}
          TAG="${{ inputs.image_tag }}"
          TAG=${TAG:-$GITHUB_RUN_ID}

          PARAMS=()

          if [ -f "$APP_FILE" ]; then
            while IFS=":" read -r key value || [ -n "$key" ]; do
              key="$(echo "$key" | xargs)"
              value="$(echo "$value" | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')"
              if [ -z "$key" ] || [[ "$key" == \#* ]]; then
                continue
              fi
              PARAMS+=("$key=$value")
            done < "$APP_FILE"
          else
            echo "Missing application config: $APP_FILE"
            exit 1
          fi

          PARAMS+=(
            EnvironmentName=staging
            ServiceName="${{ inputs.service_name }}"
            ImageTag="$TAG"
            EcrUrl="$STAGING_ECR_URL"
            RepoName="$REPO_NAME"
            ClusterName="$STAGING_ECS_CLUSTER_NAME"
            SubnetIds="$STAGING_SUBNET_IDS"
            SecurityGroupIds="$STAGING_SECURITY_GROUP_IDS"
            TaskExecutionRoleArn="$STAGING_TASK_EXEC_ROLE_ARN"
            TaskRoleArn="$STAGING_TASK_ROLE_ARN"
          )

          if [ -n "${STAGING_DESIRED_COUNT:-}" ]; then PARAMS+=(DesiredCount="$STAGING_DESIRED_COUNT"); fi
          if [ -n "${STAGING_CPU:-}" ]; then PARAMS+=(Cpu="$STAGING_CPU"); fi
          if [ -n "${STAGING_MEMORY:-}" ]; then PARAMS+=(Memory="$STAGING_MEMORY"); fi
          if [ -n "${STAGING_CONTAINER_PORT:-}" ]; then PARAMS+=(ContainerPort="$STAGING_CONTAINER_PORT"); fi
          if [ -n "${STAGING_ASSIGN_PUBLIC_IP:-}" ]; then PARAMS+=(AssignPublicIp="$STAGING_ASSIGN_PUBLIC_IP"); fi

          aws cloudformation deploy \
            --stack-name "service1-staging" \
            --template-file "common/cloudformation/templates/service1-cloudformation.yaml" \
            --parameter-overrides "${PARAMS[@]}"

  promote-prod:
    name: Promote to prod
    uses: ./.github/workflows/ai-tools-promote-image.yaml
    needs: deploy-staging
    with:
      service_name: ${{ inputs.service_name }}
      image_tag: ${{ inputs.image_tag }}
      src_role_arn: ${{ vars.STAGING_ROLE_ARN }}
      src_ecr_url: ${{ vars.STAGING_ECR_URL }}
      dst_role_arn: ${{ vars.PROD_ROLE_ARN }}
      dst_ecr_url: ${{ vars.PROD_ECR_URL }}
      deploy_env: prod
    secrets: inherit

  deploy-prod:
    name: Deploy (prod)
    runs-on: ubuntu-24.04
    needs: promote-prod
    environment: prod
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      PROD_ECR_URL: ${{ vars.PROD_ECR_URL }}
      PROD_ECS_CLUSTER_NAME: ${{ vars.PROD_ECS_CLUSTER_NAME }}
      PROD_SUBNET_IDS: ${{ vars.PROD_SUBNET_IDS }}
      PROD_SECURITY_GROUP_IDS: ${{ vars.PROD_SECURITY_GROUP_IDS }}
      PROD_TASK_EXEC_ROLE_ARN: ${{ vars.PROD_TASK_EXEC_ROLE_ARN }}
      PROD_TASK_ROLE_ARN: ${{ vars.PROD_TASK_ROLE_ARN }}
      PROD_DESIRED_COUNT: ${{ vars.PROD_DESIRED_COUNT }}
      PROD_CPU: ${{ vars.PROD_CPU }}
      PROD_MEMORY: ${{ vars.PROD_MEMORY }}
      PROD_CONTAINER_PORT: ${{ vars.PROD_CONTAINER_PORT }}
      PROD_ASSIGN_PUBLIC_IP: ${{ vars.PROD_ASSIGN_PUBLIC_IP }}
    steps:
      - uses: actions/checkout@v6

      - name: Configure AWS Credentials (prod)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.PROD_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Deploy CloudFormation (prod)
        run: |
          set -euo pipefail

          APP_FILE="common/cloudformation/templates/service1-application-prod.yaml"

          required_vars=(
            PROD_ECR_URL
            PROD_ECS_CLUSTER_NAME
            PROD_SUBNET_IDS
            PROD_SECURITY_GROUP_IDS
            PROD_TASK_EXEC_ROLE_ARN
            PROD_TASK_ROLE_ARN
          )

          for var in "${required_vars[@]}"; do
            if [ -z "${!var:-}" ]; then
              echo "Missing required variable: $var"
              exit 1
            fi
          done

          REPO_NAME=${GITHUB_REPOSITORY#"zinnia/"}
          TAG="${{ inputs.image_tag }}"
          TAG=${TAG:-$GITHUB_RUN_ID}

          PARAMS=()

          if [ -f "$APP_FILE" ]; then
            while IFS=":" read -r key value || [ -n "$key" ]; do
              key="$(echo "$key" | xargs)"
              value="$(echo "$value" | sed 's/^[[:space:]]*//' | sed 's/[[:space:]]*$//')"
              if [ -z "$key" ] || [[ "$key" == \#* ]]; then
                continue
              fi
              PARAMS+=("$key=$value")
            done < "$APP_FILE"
          else
            echo "Missing application config: $APP_FILE"
            exit 1
          fi

          PARAMS+=(
            EnvironmentName=prod
            ServiceName="${{ inputs.service_name }}"
            ImageTag="$TAG"
            EcrUrl="$PROD_ECR_URL"
            RepoName="$REPO_NAME"
            ClusterName="$PROD_ECS_CLUSTER_NAME"
            SubnetIds="$PROD_SUBNET_IDS"
            SecurityGroupIds="$PROD_SECURITY_GROUP_IDS"
            TaskExecutionRoleArn="$PROD_TASK_EXEC_ROLE_ARN"
            TaskRoleArn="$PROD_TASK_ROLE_ARN"
          )

          if [ -n "${PROD_DESIRED_COUNT:-}" ]; then PARAMS+=(DesiredCount="$PROD_DESIRED_COUNT"); fi
          if [ -n "${PROD_CPU:-}" ]; then PARAMS+=(Cpu="$PROD_CPU"); fi
          if [ -n "${PROD_MEMORY:-}" ]; then PARAMS+=(Memory="$PROD_MEMORY"); fi
          if [ -n "${PROD_CONTAINER_PORT:-}" ]; then PARAMS+=(ContainerPort="$PROD_CONTAINER_PORT"); fi
          if [ -n "${PROD_ASSIGN_PUBLIC_IP:-}" ]; then PARAMS+=(AssignPublicIp="$PROD_ASSIGN_PUBLIC_IP"); fi

          aws cloudformation deploy \
            --stack-name "service1-prod" \
            --template-file "common/cloudformation/templates/service1-cloudformation.yaml" \
            --parameter-overrides "${PARAMS[@]}"
