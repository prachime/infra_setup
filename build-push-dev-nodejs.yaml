name: "Build & Push to DEV"

permissions:
  id-token: write
  contents: read

on:
  workflow_call:
    inputs:
      service_name:
        required: true
        type: string

      image_tag:
        required: false
        type: string

      context:
        required: false
        type: string
        default: "."

      dockerfile:
        required: false
        type: string
        default: "Dockerfile"

jobs:
  build-push-dev:
    runs-on: ubuntu-24.04-arm

    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Configure AWS Credentials (DEV)
        uses: aws-actions/configure-aws-credentials@v6
        with:
          role-to-assume: ${{ vars.DEV_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Login to DEV ECR
        run: |
          aws ecr get-login-password --region ${{ vars.AWS_REGION }} \
            | docker login --username AWS --password-stdin ${{ vars.DEV_ECR_URL }}

      - name: Build & Push image to DEV
        run: |
          set -euo pipefail

          REPO_NAME=${GITHUB_REPOSITORY#"avijo1403/"}

          # Convert repo name to lowercase
          REPO_NAME=$(echo "$REPO_NAME" | tr '[:upper:]' '[:lower:]')

          TAG="${{ inputs.image_tag }}"
          TAG=${TAG:-$GITHUB_RUN_ID}

          IMAGE="${{ vars.DEV_ECR_URL }}/${REPO_NAME}:${{ inputs.service_name }}-${TAG}"

          docker buildx build \
            --platform linux/arm64 \
            -f "${{ inputs.dockerfile }}" \
            -t "$IMAGE" \
            --push \
            "${{ inputs.context }}"
